name: ontology-qa

services:
  neo4j:
    image: neo4j:5.23-community
    container_name: ontology-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-ontology-qa-password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-ontology-qa-password}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ontology-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ontology-backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-ontology-qa-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - LLM_API_KEY=${LLM_API_KEY:-your-api-key-here}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-chat}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120}
      - UPLOAD_DIR=/app/data/uploads
      - DATABASE_URL=sqlite:////app/data/metadata.db
      - DEBUG=${DEBUG:-false}
    volumes:
      - app_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - ontology-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ontology-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ontology-net
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  app_data:

networks:
  ontology-net:
    driver: bridge
